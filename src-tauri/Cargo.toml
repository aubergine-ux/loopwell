[package]
name = "loopwell"
version = "2.0.0"
description = "A tactile beat maker"
authors = ["Aubergine-UX"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "loopwell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
