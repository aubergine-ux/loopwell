name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - name: Install the server's packages
        run: npm ci
        working-directory: server
      - name: Type check
        run: npm run check
      - name: Server type check and tests
        run: npm run check && npm test
        working-directory: server
      - name: Unit tests
        run: npm test
      - name: Engine stress benchmark
        run: npm run bench
      - name: Engine stress benchmark, with everything newer switched on
        run: npx tsx scripts/bench.ts --full
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          CHROMIUM: /usr/bin/google-chrome
      - name: Startup size is within budget, and the heavy parts load on demand
        run: npm run budget
      - name: Pattern tools, instruments, live screen, mixer, workflow, onboarding, accessibility
        run: npm run test:features
        env:
          CHROMIUM: /usr/bin/google-chrome
      - name: Audio thread keeps time while the page is busy
        run: npm run test:realtime
        env:
          CHROMIUM: /usr/bin/google-chrome
      - name: Community features against the real server
        run: npm run test:community
        env:
          CHROMIUM: /usr/bin/google-chrome
      - name: Live sessions, three browsers through the relay
        run: npm run test:live
        env:
          CHROMIUM: /usr/bin/google-chrome
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  desktop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: A placeholder for the web build the shell embeds
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html
      - name: Desktop shell tests
        run: cargo test
        working-directory: src-tauri

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The same browser tests in Firefox, so the app isn't quietly a Chrome-only one.
  firefox:
    name: Browser tests in Firefox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - name: Install the server's packages
        run: npm ci
        working-directory: server
      - name: Install Firefox
        run: npx playwright-core install --with-deps firefox
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          BROWSER: firefox
      - name: Every feature suite
        run: npm run test:features
        env:
          BROWSER: firefox
      - name: Community features against the real server
        run: npm run test:community
        env:
          BROWSER: firefox

  # The browser tests above run on Linux. Everything that doesn't need a browser is also run where the
  # desktop app is built, so a path or line-ending mistake shows up here and not in a release.
  platforms:
    name: Checks, unit tests and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - name: Install the server's packages
        run: npm ci
        working-directory: server
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Startup size is within budget
        run: npm run budget
