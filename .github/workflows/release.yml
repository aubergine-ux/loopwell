name: Release

# Pushing a tag like v3.0.0 builds the desktop app for every platform and
# attaches the installers, plus a zip of the web app, to a draft GitHub
# release. Running it by hand builds the same things and keeps them as
# workflow artifacts, without creating a release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            args: ''
            bundle: src-tauri/target/release/bundle
          - name: Windows
            os: windows-latest
            args: ''
            bundle: src-tauri/target/release/bundle
          - name: macOS (Apple silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
            bundle: src-tauri/target/aarch64-apple-darwin/release/bundle
          - name: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
            bundle: src-tauri/target/x86_64-apple-darwin/release/bundle
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # only a tag makes a release; a manual run just builds
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Loopwell {0}', github.ref_name) || '' }}
          releaseBody: Installers for Windows, macOS and Linux, and the web app as a zip. See the README for what is new.
          releaseDraft: true
      - uses: actions/upload-artifact@v4
        with:
          name: loopwell-${{ matrix.os }}${{ matrix.target && format('-{0}', matrix.target) || '' }}
          if-no-files-found: error
          path: |
            ${{ matrix.bundle }}/**/*.deb
            ${{ matrix.bundle }}/**/*.rpm
            ${{ matrix.bundle }}/**/*.AppImage
            ${{ matrix.bundle }}/**/*.msi
            ${{ matrix.bundle }}/**/*.exe
            ${{ matrix.bundle }}/**/*.dmg

  web:
    name: Web app
    runs-on: ubuntu-latest
    needs: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cd dist && zip -qr ../loopwell-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: loopwell-web
          path: loopwell-web.zip
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload "${{ github.ref_name }}" loopwell-web.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
