# The optional Loopwell backend: Postgres, MinIO (S3-compatible storage) and
# the API. Copy .env.example to .env, fill it in, then: docker compose up -d
# See server/README.md.

name: loopwell

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: loopwell
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loopwell}
      POSTGRES_DB: loopwell
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U loopwell -d loopwell']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-loopwell}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-loopwell-secret}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  # creates the bucket once, then exits (the server image ships the mc client)
  minio-init:
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-loopwell}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-loopwell-secret}
      S3_BUCKET: ${S3_BUCKET:-loopwell}
    entrypoint:
      - sh
      - -c
      - |
        mc alias set store http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "store/$$S3_BUCKET"
    restart: 'no'

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # everything in .env reaches the server; the values below win over it
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: 8787
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
      APP_ORIGINS: ${APP_ORIGINS:-http://localhost:5173}
      DATABASE_URL: postgres://loopwell:${POSTGRES_PASSWORD:-loopwell}@postgres:5432/loopwell
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-loopwell}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-loopwell}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-loopwell-secret}
      S3_FORCE_PATH_STYLE: '1'
      ADMIN_HANDLES: ${ADMIN_HANDLES:-}
      DEV_LOGIN: ${DEV_LOGIN:-}
    ports:
      - '${API_PORT:-8787}:8787'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8787/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5

volumes:
  pgdata:
  miniodata:
